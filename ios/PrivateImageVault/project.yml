# XcodeGen project specification.
# This keeps the Xcode project reproducible without hand-editing a large .pbxproj file.
name: PrivateImageVault

options:
  # The deployment target is intentionally modern so we can use current SwiftUI APIs.
  deploymentTarget:
    iOS: "17.0"

targets:
  PrivateImageVault:
    # This target builds an installable iOS application.
    type: application

    # The app runs only on iOS, matching the native-iPhone direction.
    platform: iOS

    # All Swift source files live under the app source folder.
    sources:
      - path: PrivateImageVault

    settings:
      base:
        # Replace this bundle id with your own reverse-DNS identifier before App Store work.
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PrivateImageVault

        # Swift 5 is the language mode used by current Xcode releases.
        SWIFT_VERSION: 5.0

        # This app uses a hand-written Info.plist so permission strings are explicit.
        INFOPLIST_FILE: PrivateImageVault/Info.plist

        # Automatic signing is easiest for a local device during early development.
        CODE_SIGN_STYLE: Automatic
